[Service]
# The application remains root-owned for PiDog hardware access.  These three
# variables let its sounddevice/Piper processes use matt's existing desktop
# PulseAudio session, where Bluetooth audio devices are available.
Environment="XDG_RUNTIME_DIR=/run/user/1000"
Environment="PULSE_SERVER=unix:/run/user/1000/pulse/native"
Environment="PULSE_COOKIE=/home/matt/.config/pulse/cookie"
ExecStartPre=/home/matt/pidog/scripts/doggie_audio_bootstrap.sh
